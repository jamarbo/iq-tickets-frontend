services:
  - type: static_site
    name: iq-tickets-frontend
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://ticket-system-spring-boot.onrender.com/api
      - key: VITE_DEMO
        value: "false"
